<div class="app-loader" [hidden]="!loading || hushed || routeLoading.busy" role="status" aria-label="Loading"><span class="app-loader__bar"></span><i class="app-loader__ring"></i></div>
<p-toast position="bottom-center" [life]="5000"></p-toast>
<app-undo-toast></app-undo-toast>
<p-confirmDialog rejectButtonStyleClass="p-button-outlined"></p-confirmDialog>
<app-boot-skeleton *ngIf="booting"></app-boot-skeleton>
<div [style.display]="booting ? 'none' : 'contents'"><router-outlet></router-outlet></div>
