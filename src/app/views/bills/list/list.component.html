<div class="d-flex mb-5 justify-content-between align-items-center">
  <h4 class="">Bills</h4>
</div>
<div class="card">
  <p-table
    #dt1
    [value]="bills"
    [paginator]="true"
    [rows]="5"
    [globalFilterFields]="['customerName']"
    (sortFunction)="customSort($event)"
    [customSort]="true"
    [tableStyle]="{ 'min-width': '60rem' }"
    [rowsPerPageOptions]="[5, 10, 15]"
  >
    <ng-template pTemplate="caption">
      <button
        pButton
        label="Clear"
        class="p-button-outlined"
        icon="pi pi-filter-slash"
        (click)="clear(dt1)"
      ></button>
      <span class="p-input-icon-left ml-auto">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          [(ngModel)]="inputValue"
          (input)="dt1?.filterGlobal(inputValue, 'contains')"
        />
      </span>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name" style="width: 40%" scope="row">
          Quotation Name <p-sortIcon field="name"></p-sortIcon>
        </th>
        <th pSortableColumn="description" style="width: 40%" scope="row">
          Amount <p-sortIcon field="description"></p-sortIcon>
        </th>
        <th pSortableColumn="actions" style="width: 20%" scope="row">
          Actions
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-bill>
      <tr>
        <td>{{ bill.name }}</td>
        <td>{{ bill.grand_total }}</td>
        <td>
          <p-button
            icon="pi pi-download"
            (click)="downloadBill(bill)"
            styleClass="p-button-rounded p-button-text"
          ></p-button>
          <p-button
            icon="pi pi-trash"
            (click)="deleteBill(bill)"
            styleClass="p-button-rounded p-button-text"
          ></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
<c-modal
  id="liveDemoModal"
  [visible]="visible"
  backdrop="static"
  alignment="center"
  (visibleChange)="handleFormModal($event)"
>
  <c-modal-header>
    <h5 cModalTitle color="warm">Print Bill</h5>
  </c-modal-header>
  <c-modal-body>
    <div>
      <c-row>
        <label cLabel="col" class="col-sm-3" for="GSTIN">
          Customer GSTIN
        </label>
        <c-col [sm]="9">
          <input
            cFormControl
            id="GSTIN"
            type="text"
            [formControl]="customerGstin"
          />
        </c-col>
      </c-row>
    </div>
  </c-modal-body>
  <c-modal-footer>
    <p-button styleClass="p-button-secondary" (click)="toggleWarningModal()">
      Cancel
    </p-button>
    <p-button (click)="submit()"> Print </p-button>
  </c-modal-footer>
</c-modal>
