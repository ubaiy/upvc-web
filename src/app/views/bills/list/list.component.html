<div class="app-page-surface">
  <app-page-header
    eyebrow="Sales"
    title="Bills"
    subtitle="Review billed quotations and download invoices."
  ></app-page-header>

  <div class="app-table-card">
    <div class="app-section-heading">
      <span class="app-section-heading__title">Bill list</span>
    </div>
    <div class="table-responsive">
    <p-table
    #dt1
    [value]="bills"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [globalFilterFields]="['customerName']"
    (sortFunction)="customSort($event)"
    [customSort]="true"
    [tableStyle]="{ 'min-width': '60rem' }"
    [rowsPerPageOptions]="[10, 25, 50]"
  >
    <ng-template pTemplate="caption">
      <button
        pButton
        label="Clear"
        class="p-button-outlined"
        icon="pi pi-filter-slash"
        (click)="clear(dt1)"
      ></button>
      <span class="p-input-icon-left ml-auto">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          [(ngModel)]="inputValue"
          (input)="dt1?.filterGlobal(inputValue, 'contains')"
        />
      </span>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name" style="width: 40%" scope="col">
          Quotation Name <p-sortIcon field="name"></p-sortIcon>
        </th>
        <th pSortableColumn="grand_total" style="width: 40%" scope="col">
          Amount <p-sortIcon field="grand_total"></p-sortIcon>
        </th>
        <th style="width: 20%" scope="col">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-bill>
      <tr>
        <td>{{ bill.name }}</td>
        <td>{{ bill.grand_total | currency : "INR" }}</td>
        <td>
          <p-button
            icon="pi pi-download"
            pTooltip="Download bill"
            aria-label="Download bill"
            (click)="downloadBill(bill)"
            styleClass="p-button-rounded p-button-text"
          ></p-button>
          <p-button
            icon="pi pi-trash"
            pTooltip="Delete bill"
            aria-label="Delete bill"
            (click)="deleteBill(bill)"
            styleClass="p-button-rounded p-button-text p-button-danger"
          ></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">No records yet</td>
      </tr>
    </ng-template>
  </p-table>
    </div>
  </div>
<c-modal
  id="liveDemoModal"
  [visible]="visible"
  backdrop="static"
  alignment="center"
  (visibleChange)="handleFormModal($event)"
>
  <c-modal-header>
    <h5 cModalTitle color="warm">Print Bill</h5>
  </c-modal-header>
  <c-modal-body>
    <div>
      <c-row>
        <label cLabel="col" class="col-sm-3" for="GSTIN">
          Customer GSTIN
        </label>
        <c-col [sm]="9">
          <input
            cFormControl
            id="GSTIN"
            type="text"
            [formControl]="customerGstin"
          />
        </c-col>
      </c-row>
    </div>
  </c-modal-body>
  <c-modal-footer>
    <p-button styleClass="p-button-secondary" (click)="toggleWarningModal()">
      Cancel
    </p-button>
    <p-button (click)="submit()"> Print </p-button>
  </c-modal-footer>
</c-modal>
</div>
