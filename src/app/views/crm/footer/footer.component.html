<div class="d-flex mb-5 justify-content-between align-items-center">
  <h4 class="">Footers</h4>
  <p-button routerLink="add">Add New</p-button>
</div>
<div class="card">
  <p-table
    [value]="footers"
    [paginator]="true"
    [rows]="5"
    [globalFilterFields]="['name']"
    (sortFunction)="customSort($event)"
    [customSort]="true"
    [tableStyle]="{ 'min-width': '60rem' }"
    [rowsPerPageOptions]="[5, 10, 15]"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="identity" style="width: 40%" scope="row">
          Name <p-sortIcon field="identity"></p-sortIcon>
        </th>
        <th pSortableColumn="name" style="width: 40%" scope="row">
          Description <p-sortIcon field="name"></p-sortIcon>
        </th>
        <th style="width: 20%" scope="row">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-footer>
      <tr>
        <td>{{ footer.name }}</td>
        <td>{{ footer.description }}</td>
        <td>
          <p-button
            icon="pi pi-pencil"
            aria-label="Edit"
            [routerLink]="['edit', footer.id]"
            styleClass="p-button-rounded p-button-text"
          ></p-button>
        </td>
      </tr>

    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">No footers yet</td>
      </tr>
    </ng-template>
  </p-table>
</div>
