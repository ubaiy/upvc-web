<div class="app-page-surface">
  <app-page-header eyebrow="Masters" [title]="title"></app-page-header>
  <div class="app-card">
    <div class="app-section-heading">
      <span class="app-section-heading__title">Product details</span>
    </div>
    <div class="app-card__body">
      <form [formGroup]="form">
    <c-row class="mt-3">
      <label cLabel="col" class="col-sm-1" for="name">
        Name <span class="error">*</span></label
      >
      <c-col [sm]="5">
        <input cFormControl id="name" type="text" formControlName="name" />
        <small
          class="error"
          *ngIf="
            (f['name']?.errors?.['required'] && f['name'].touched) ||
            (f['name']?.errors?.['required'] && submitted)
          "
          >Name is required</small
        >
      </c-col>
      <label cLabel="col" class="col-sm-1" for="description">
        Description<span class="error">*</span></label
      >
      <c-col [sm]="5">
        <input
          cFormControl
          id="description"
          type="text"
          formControlName="description"
        />
        <small
          class="error"
          *ngIf="
            (f['description']?.errors?.['required'] && f['description'].touched) ||
            (f['description']?.errors?.['required'] && submitted)
          "
          >Description is required</small
        >
      </c-col>
    </c-row>
    <c-row class="mt-3">
      <label cLabel="col" class="col-sm-1" for="product_no">
        Product No <span class="error">*</span></label
      >
      <c-col [sm]="5">
        <input
          cFormControl
          id="product_no"
          type="text"
          formControlName="product_no"
        />
        <small
          class="error"
          *ngIf="
            (f['product_no']?.errors?.['required'] && f['product_no'].touched) ||
            (f['product_no']?.errors?.['required'] && submitted)
          "
          >Product No is required</small
        >
      </c-col>
      <label cLabel="col" class="col-sm-1" for="costhead">
        Costhead <span class="error">*</span></label
      >
      <c-col [sm]="5">
        <select
          aria-label="Default select example"
          cSelect
          formControlName="costhead"
        >
          <option value="" disabled>select</option>
          <option *ngFor="let costhead of costheadList" [value]="costhead">
            {{ costhead }}
          </option>
        </select>
        <small
          class="error"
          *ngIf="
            (f['costhead']?.errors?.['required'] && f['costhead'].touched) ||
            (f['costhead']?.errors?.['required'] && submitted)
          "
          >Costhead is required</small
        >
      </c-col>
    </c-row>
    <c-row class="mt-3">
      <label cLabel="col" class="col-sm-1" for="type">
        Costhead Type <span class="error">*</span></label
      >
      <c-col [sm]="5">
        <select
          aria-label="Default select example"
          cSelect
          formControlName="type"
        >
          <option value="" disabled>select</option>
          <option
            *ngFor="let costheadType of costheadTypeList"
            [value]="costheadType"
          >
            {{ costheadType }}
          </option>
        </select>
        <small
          class="error"
          *ngIf="
            (f['type']?.errors?.['required'] && f['type'].touched) ||
            (f['type']?.errors?.['required'] && submitted)
          "
          >Costhead Type is required</small
        >
      </c-col>
      <label cLabel="col" class="col-sm-1" for="category"> Category </label>
      <c-col [sm]="5">
        <select
          aria-label="Default select example"
          cSelect
          formControlName="category"
        >
          <option value="" disabled>select</option>
          <option
            *ngFor="let category of categoryList"
            [value]="category"
          >
            {{ category }}
          </option>
        </select>
      </c-col>
    </c-row>
    <c-row class="mt-3">
      <label cLabel="col" class="col-sm-1" for="unit">
        Unit <span class="error">*</span></label
      >
      <c-col [sm]="5">
        <select
          aria-label="Default select example"
          cSelect
          formControlName="unit"
        >
          <option value="" disabled>select</option>
          <option *ngFor="let unit of unitList" [value]="unit">
            {{ unit }}
          </option>
        </select>
        <small
          class="error"
          *ngIf="
            (f['unit']?.errors?.['required'] && f['unit'].touched) ||
            (f['unit']?.errors?.['required'] && submitted)
          "
          >Unit is required</small
        >
      </c-col>
      <label cLabel="col" class="col-sm-1" for="cost">
        Cost<span class="error">*</span></label
      >
      <c-col [sm]="5">
        <input cFormControl id="cost" type="text" formControlName="cost" />
        <small
          class="error"
          *ngIf="
            (f['cost']?.errors?.['required'] && f['cost'].touched) ||
            (f['cost']?.errors?.['required'] && submitted)
          "
          >Cost is required</small
        >
        <small
          class="error"
          *ngIf="
            (!f['cost']?.errors?.['required'] && (f['cost']?.errors?.['pattern'] || f['cost']?.errors?.['max']) && f['cost'].touched) ||
            (!f['cost']?.errors?.['required'] && (f['cost']?.errors?.['pattern'] || f['cost']?.errors?.['max']) && submitted)
          "
          >Please enter valid Cost Number</small
        >
      </c-col>
    </c-row>
    <div class="mt-5 d-flex gap-4">
      <p-button (click)="submit()"> {{ editable ? "Save" : "Add" }}</p-button>
      <p-button
        color="secondary"
        styleClass="p-button-secondary"
        (click)="toggleWarningModal()"
      >
        Cancel</p-button
      >
    </div>
      </form>
    </div>
  </div>
</div>
