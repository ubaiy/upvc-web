<div class="app-page-surface">
  <app-page-header eyebrow="Masters" [title]="title">
    <p-button actions (click)="redirectToEdit()">Add New</p-button>
  </app-page-header>
  <div class="app-table-card">
    <div class="table-responsive">
      <p-table
    #dt1
    [value]="masterData"
    dataKey="id"
    [rows]="10"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 25, 50]"
    [paginator]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [globalFilterFields]="[
      'product_no',
      'name',
      'description',
      'type',
      'cost',
      'unit'
    ]"
  >
    <ng-template pTemplate="caption">
      <button
        pButton
        label="Clear"
        class="p-button-outlined"
        icon="pi pi-filter-slash"
        (click)="clear(dt1)"
      ></button>
      <span class="p-input-icon-left ml-auto">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          [(ngModel)]="inputValue"
          (input)="dt1?.filterGlobal(inputValue, 'contains')"
        />
      </span>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="product_no" style="width: 10%" scope="col">
          Product No <p-sortIcon field="product_no"></p-sortIcon>
        </th>
        <th pSortableColumn="name" style="width: 15%" scope="col">
          Name <p-sortIcon field="name"></p-sortIcon>
        </th>

        <th pSortableColumn="description" style="width: 30%" scope="col">
          Description <p-sortIcon field="description"></p-sortIcon>
        </th>
        <th pSortableColumn="type" style="width: 15%" scope="col">
          Type <p-sortIcon field="type"></p-sortIcon>
        </th>
        <th pSortableColumn="cost" style="width: 10%" scope="col">
          Cost <p-sortIcon field="cost"></p-sortIcon>
        </th>
        <th pSortableColumn="unit" style="width: 10%" scope="col">
          Unit <p-sortIcon field="unit"></p-sortIcon>
        </th>
        <th style="width: 10%" scope="col">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-masterData>
      <tr>
        <td>{{ masterData.product_no }}</td>
        <td>{{ masterData.name }}</td>
        <td>{{ masterData.description }}</td>
        <td>{{ masterData.type }}</td>
        <td>{{ masterData.cost }}</td>
        <td>{{ masterData.unit }}</td>
        <td>
          <p-button
            icon="pi pi-pencil"
            pTooltip="Edit"
            aria-label="Edit"
            (click)="redirectToEdit(masterData)"
            styleClass="p-button-rounded p-button-text"
          ></p-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7">No records yet</td>
      </tr>
    </ng-template>
  </p-table>
    </div>
  </div>
</div>
