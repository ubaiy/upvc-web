<app-auth-layout
  heading="Forgot your password?"
  lead="Resetting it by email is not available yet. Here is how to get back in."
  pageTitle="Forgot password"
>
  <ol class="reset-steps stack-4">
    <li>
      <span class="strong">Contact the person who set up UPVC for your workshop.</span>
      <span class="muted">They can give you a new password.</span>
    </li>
    <li>
      <span class="strong">Sign in with the new password.</span>
      <span class="muted">Then change it to one only you know, under Your profile.</span>
    </li>
  </ol>

  <a class="btn btn-primary btn-lg btn-block back" routerLink="/auth/login">
    <app-icon name="arrow-left" [mirror]="true"></app-icon>Back to sign in
  </a>
</app-auth-layout>
