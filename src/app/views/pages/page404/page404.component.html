<main class="status-page">
  <span class="brand">
    <img class="ws-mark" src="assets/brand/mark.svg" alt="" width="28" height="28" />{{ product }}
  </span>
  <div class="empty">
    <span class="empty-art"><app-icon name="search" [size]="20"></app-icon></span>
    <p class="faint tiny num">Error 404</p>
    <h1>We could not find that page</h1>
    <p>The address may be mistyped, or the page may have moved. Nothing of yours was lost.</p>
    <div class="u-row wrap actions">
      <a class="btn btn-primary" routerLink="/"><app-icon name="home"></app-icon>Go to Home</a>
      <button type="button" class="btn btn-secondary" (click)="back()">
        <app-icon name="arrow-left" [mirror]="true"></app-icon>Go back
      </button>
    </div>
  </div>
</main>
