<main class="status-page">
  <span class="brand">
    <span class="ws-mark"><app-icon name="window"></app-icon></span>UPVC
  </span>
  <div class="empty">
    <span class="empty-art"><app-icon name="alert" [size]="20"></app-icon></span>
    <p class="faint tiny num">Error 500</p>
    <h1>Something went wrong on our side</h1>
    <p>It is not something you did. Try again in a moment.</p>
    <div class="u-row wrap actions">
      <button type="button" class="btn btn-primary" (click)="retry()">
        <app-icon name="refresh"></app-icon>Try again
      </button>
      <a class="btn btn-secondary" routerLink="/"><app-icon name="home"></app-icon>Go to Home</a>
    </div>
  </div>
</main>
