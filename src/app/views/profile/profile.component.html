<app-page-header title="Settings"></app-page-header>

<div class="tabs" role="tablist" aria-label="Settings sections">
  <a
    *ngFor="let tab of tabs"
    class="tab"
    role="tab"
    routerLink="/profile"
    [queryParams]="{ tab: tab.id }"
    [id]="'settings-tab-' + tab.id"
    [attr.aria-selected]="tab === active"
    aria-controls="settings-panel"
    >{{ tab.label }}</a
  >
</div>

<div id="settings-panel" role="tabpanel" [attr.aria-labelledby]="'settings-tab-' + active.id">
  <ng-container *ngComponentOutlet="active.component"></ng-container>
</div>
