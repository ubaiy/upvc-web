<div class="app-page-surface">
  <app-page-header
    eyebrow="Sales"
    [title]="editable ? 'Edit Quotation' : 'Add Quotation'"
    subtitle="Choose the customer, delivery address and area for this quotation."
  ></app-page-header>

  <div class="app-card">
    <div class="app-section-heading">
      <span class="app-section-heading__title">Quotation details</span>
    </div>
    <div class="app-card__body">
      <form [formGroup]="form">
        <c-row class="g-4">
          <c-col [md]="6">
            <label class="app-field-label" for="customer_id">
              Quotation Name <span class="error">*</span></label
            >
            <input pInputText type="text" formControlName="quatation_name" />
          </c-col>
          <c-col [md]="6">
            <label class="app-field-label" for="customer_id">
              Customer <span class="error">*</span></label
            >
            <select
              aria-label="Default select example"
              cSelect
              formControlName="customer_id"
            >
              <option value="" disabled>select</option>
              <option *ngFor="let customer of customerList" [value]="customer.id">
                {{ customer.name }}
              </option>
            </select>
          </c-col>
          <c-col [md]="6">
            <label class="app-field-label" for="customer_address_id">
              Customer Address <span class="error">*</span></label
            >
            <select
              aria-label="Default select example"
              cSelect
              formControlName="customer_address_id"
            >
              <option value="" disabled>select</option>
              <option
                *ngFor="let customerAddress of customerAddressList"
                [value]="customerAddress.id"
              >
                {{
                  customerAddress.address +
                    ", " +
                    customerAddress.address_line2 +
                    ", " +
                    customerAddress.city +
                    ", " +
                    customerAddress.state +
                    ", " +
                    customerAddress.zip_code
                }}
              </option>
            </select>
          </c-col>
          <c-col [md]="6">
            <label class="app-field-label" for="area_id">
              Area <span class="error">*</span></label
            >
            <select
              aria-label="Default select example"
              cSelect
              formControlName="area_id"
            >
              <option value="" disabled>select</option>
              <option *ngFor="let area of areaList" [value]="area.id">
                {{ area.name }}
              </option>
            </select>
          </c-col>
        </c-row>
        <div class="mt-4 d-flex gap-3">
          <p-button (click)="submit()"> {{ editable ? "Save" : "Add" }}</p-button>
          <p-button
            color="secondary"
            styleClass="p-button-secondary"
            (click)="toggleWarningModal()"
          >
            Cancel</p-button
          >
        </div>
      </form>
    </div>
  </div>
</div>
