<p-dialog
  closeAriaLabel="Close"
  header="Duplicate this quotation?"
  [visible]="visible"
  (visibleChange)="$event ? null : close()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!copying"
  [style]="{ width: '440px' }"
>
  <form [formGroup]="form" class="u-col" style="gap: var(--s-4)" (ngSubmit)="submit()" novalidate>
    <p class="muted small" *ngIf="quotation as q">
      A new draft is made from “{{ q.name }}”<ng-container *ngIf="q.windows">
        with {{ q.windows === 1 ? '1 window' : q.windows + ' windows' }}</ng-container
      >, at today’s prices. The original is not changed.
    </p>

    <app-callout tone="warn" *ngIf="loadError">
      {{ loadError }}
      <button action type="button" class="btn btn-secondary btn-sm" (click)="load()">Try again</button>
    </app-callout>

    <div class="field">
      <label class="label" for="dq-customer">Customer</label>
      <p-dropdown
        inputId="dq-customer"
        formControlName="customer_id"
        [options]="customers"
        optionLabel="name"
        optionValue="id"
        [filter]="true"
        filterBy="name,phone"
        filterPlaceholder="Search by name or phone"
        placeholder="Choose a customer"
        appendTo="body"
        [style]="{ width: '100%' }"
        [styleClass]="customerError ? 'ng-invalid ng-dirty' : ''"
        aria-describedby="dq-customer-hint"
      ></p-dropdown>
      <span class="error" *ngIf="customerError; else customerHint">{{ customerError }}</span>
      <ng-template #customerHint>
        <span class="hint" id="dq-customer-hint">Another customer gets their own price list and address.</span>
      </ng-template>
    </div>

    <div class="field">
      <label class="label" for="dq-name">Quotation name</label>
      <input class="input" id="dq-name" type="text" formControlName="quatation_name" autocomplete="off" maxlength="191" />
    </div>

    <app-callout tone="danger" *ngIf="saveError">{{ saveError }}</app-callout>

    <button type="submit" class="sr-only" tabindex="-1" aria-hidden="true">Submit</button>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancel" [outlined]="true" [disabled]="copying" (onClick)="close()"></p-button>
    <p-button label="Duplicate quotation" [loading]="copying" (onClick)="submit()"></p-button>
  </ng-template>
</p-dialog>
