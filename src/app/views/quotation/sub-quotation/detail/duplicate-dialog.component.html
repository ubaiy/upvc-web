<p-dialog
  closeAriaLabel="Close"
  header="Duplicate this quotation?"
  [visible]="visible"
  (visibleChange)="$event ? null : close()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!saving"
  [style]="{ width: '440px' }"
>
  <form class="u-col" style="gap: var(--s-4)" (ngSubmit)="submit()" novalidate *ngIf="quotation as q">
    <p class="muted small">
      A new draft is made from <bdi>{{ q.number }}</bdi> with
      {{ q.lines.length === 1 ? '1 window' : q.lines.length + ' windows' }}, at today’s prices.
    </p>

    <div class="field">
      <label class="label" for="dup-customer">Customer</label>
      <p-dropdown
        inputId="dup-customer"
        name="customer"
        [(ngModel)]="customerId"
        [options]="customers"
        optionLabel="name"
        optionValue="id"
        [filter]="customers.length > 6"
        filterBy="name,phone"
        filterPlaceholder="Search by name or phone"
        placeholder="Choose a customer"
        appendTo="body"
        [style]="{ width: '100%' }"
      ></p-dropdown>
    </div>

    <div class="field">
      <label class="label" for="dup-name">Quotation name</label>
      <input class="input" id="dup-name" name="name" type="text" maxlength="191" autocomplete="off" [(ngModel)]="name" />
    </div>

    <p class="error" role="alert" *ngIf="saveError">{{ saveError }}</p>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancel" [outlined]="true" [disabled]="saving" (onClick)="close()"></p-button>
    <p-button label="Duplicate" [loading]="saving" (onClick)="submit()"></p-button>
  </ng-template>
</p-dialog>
