<p-dialog
  closeAriaLabel="Close"
  header="Pricing and terms"
  [visible]="visible"
  (visibleChange)="$event ? null : close()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!saving"
  [style]="{ width: '480px', maxWidth: '100vw' }"
>
  <form id="summary-form" class="u-col" style="gap: var(--s-4)" (ngSubmit)="submit()" novalidate>
    <app-callout tone="warn" *ngIf="loadError">
      {{ loadError }}
      <button action type="button" class="btn btn-secondary btn-sm" (click)="load()">Try again</button>
    </app-callout>

    <div class="field">
      <label class="label" for="sum-margin">Price list</label>
      <select class="select" id="sum-margin" name="margin" [(ngModel)]="marginId" [disabled]="loading || !margins.length">
        <option *ngFor="let margin of margins" [ngValue]="margin.id">{{ margin.label }}</option>
      </select>
      <span class="hint">The margin added to every window on this quotation.</span>
    </div>

    <div class="field">
      <label class="label" for="sum-terms">Payment terms</label>
      <select class="select" id="sum-terms" name="terms" [(ngModel)]="termId" [disabled]="loading || !terms.length">
        <option *ngFor="let term of terms" [ngValue]="term.id">{{ term.label }}</option>
      </select>
    </div>

    <div class="field">
      <span class="label" id="sum-discount-label">Discount</span>
      <div class="u-row" style="gap: var(--s-3)">
        <div class="seg" role="group" aria-labelledby="sum-discount-label">
          <button type="button" [attr.aria-pressed]="discountType === 'none'" (click)="setDiscountType('none')">None</button>
          <button type="button" [attr.aria-pressed]="discountType === 'percent'" (click)="setDiscountType('percent')">%</button>
          <button type="button" [attr.aria-pressed]="discountType === 'amount'" (click)="setDiscountType('amount')">₹</button>
        </div>
        <label class="input-group grow" [class.is-invalid]="!!discountError" *ngIf="discountType !== 'none'">
          <span class="unit" *ngIf="discountType === 'amount'">₹</span>
          <input
            type="number"
            name="discount"
            min="0"
            step="any"
            inputmode="decimal"
            [attr.max]="discountType === 'percent' ? 100 : null"
            [attr.aria-label]="discountType === 'percent' ? 'Discount in percent' : 'Discount in rupees'"
            [attr.aria-describedby]="discountError ? 'sum-discount-error' : null"
            [(ngModel)]="discountValue"
          />
          <span class="unit" *ngIf="discountType === 'percent'">%</span>
        </label>
      </div>
      <span class="error" id="sum-discount-error" *ngIf="discountError">{{ discountError }}</span>
      <span class="hint" *ngIf="!discountError">Taken off the windows, before GST.</span>
    </div>

    <div class="field" role="group" aria-labelledby="sum-charges-label">
      <span class="label" id="sum-charges-label">Charges</span>
      <div class="u-col" style="gap: var(--s-2)" *ngFor="let charge of charges; let i = index; trackBy: trackCharge" [attr.data-charge]="i">
        <div class="u-row" style="gap: var(--s-2)">
          <select
            class="select grow"
            style="min-width: 0"
            [name]="'charge-kind-' + i"
            [attr.aria-label]="'Charge ' + (i + 1) + ', kind'"
            [(ngModel)]="charge.kind"
          >
            <option *ngFor="let kind of chargeKinds" [ngValue]="kind.kind">{{ kind.label }}</option>
          </select>
          <label class="input-group" style="width: 140px; flex: none" [class.is-invalid]="!!chargeError(i)">
            <span class="unit">₹</span>
            <input
              type="number"
              min="0"
              step="any"
              inputmode="decimal"
              [id]="'sum-charge-amount-' + i"
              [name]="'charge-amount-' + i"
              [attr.aria-label]="'Charge ' + (i + 1) + ', amount in rupees'"
              [attr.aria-invalid]="!!chargeError(i)"
              [attr.aria-describedby]="chargeError(i) ? 'sum-charge-error-' + i : null"
              [(ngModel)]="charge.amount"
            />
          </label>
          <button
            type="button"
            class="btn btn-ghost btn-icon btn-sm"
            [attr.aria-label]="'Remove charge ' + (i + 1)"
            (click)="removeCharge(i)"
          >
            <app-icon name="x"></app-icon>
          </button>
        </div>
        <div class="u-row" style="gap: var(--s-3)">
          <input
            class="input grow"
            style="min-width: 0"
            type="text"
            maxlength="100"
            [name]="'charge-label-' + i"
            [placeholder]="'Printed as: ' + chargeName(charge.kind)"
            [attr.aria-label]="'Charge ' + (i + 1) + ', name on the quotation (optional)'"
            [(ngModel)]="charge.label"
          />
          <label class="check" style="flex: none">
            <input type="checkbox" [name]="'charge-taxable-' + i" [(ngModel)]="charge.taxable" />
            <span>Add GST</span>
          </label>
        </div>
        <span class="error" [id]="'sum-charge-error-' + i" *ngIf="chargeError(i)">{{ chargeError(i) }}</span>
      </div>
      <div>
        <button type="button" class="btn btn-secondary btn-sm" data-sum="add-charge" *ngIf="canAddCharge" (click)="addCharge()">
          <app-icon name="plus"></app-icon>{{ charges.length ? 'Add another charge' : 'Add transport, fitting or another charge' }}
        </button>
      </div>
      <span class="hint">A charge is added after the discount and is never discounted.</span>
    </div>

    <div class="field" *ngIf="hasSupply">
      <label class="label" for="sum-supply">Place of supply</label>
      <select class="select" id="sum-supply" name="supply" aria-describedby="sum-supply-hint" [(ngModel)]="supply">
        <option value="auto">{{ supplyRuleLabel }}</option>
        <option *ngFor="let state of supplyStates" [value]="state.code">{{ state.name }}</option>
      </select>
      <span class="hint" id="sum-supply-hint">{{ supplyHint }}</span>
    </div>

    <div class="field">
      <label class="label" for="sum-valid">Valid until</label>
      <app-date-field inputId="sum-valid" name="valid" [min]="today" [(ngModel)]="validUntil"></app-date-field>
    </div>

    <label class="check">
      <input type="checkbox" name="inclusive" [(ngModel)]="pricesIncludeGst" />
      <span>Prices include GST</span>
    </label>

    <p class="error" role="alert" *ngIf="saveError">{{ saveError }}</p>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancel" [outlined]="true" [disabled]="saving" (onClick)="close()"></p-button>
    <p-button label="Save" [loading]="saving" [disabled]="loading" appWrite="quotations.write" (onClick)="submit()"></p-button>
  </ng-template>
</p-dialog>
