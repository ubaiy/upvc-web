<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="./" />
    <meta
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
      name="viewport"
    />
    <meta content="UPVC" name="description" />
    <meta content="Łukasz Holeczek" name="author" />
    <meta
      content="UPVC,Bootstrap,Admin,Template,Free,Angular,Dashboard,Typescript"
      name="keyword"
    />
    <link href="assets/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="assets/favicon-32.png" rel="icon" sizes="32x32" type="image/png" />
    <link href="assets/apple-touch-icon-180.png" rel="apple-touch-icon" />
    <!-- The product's name, as PRODUCT_NAME in app/shared/configs/product.ts. The app sets the title of each page once it starts. -->
    <title>UPVC</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <app-root>
      <!-- Shown until the app starts: the same quiet loader the app uses (app.component). -->
      <style>
        .boot-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f7f7f4}
        .boot-loader i{width:28px;height:28px;border-radius:50%;border:3px solid rgba(14,111,106,.18);border-top-color:#0e6f6a;animation:boot-spin .8s linear infinite}
        @keyframes boot-spin{to{transform:rotate(360deg)}}
        @media (prefers-reduced-motion:reduce){.boot-loader i{animation-duration:2.4s}}
      </style>
      <div class="boot-loader" role="status" aria-label="Loading"><i></i></div>
    </app-root>
  </body>
</html>
